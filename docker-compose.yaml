services:
  db:
    image: postgres:16-alpine
    container_name: sms_database
    restart: unless-stopped
    environment:
      POSTGRES_USER: sms_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: sms_db
    volumes:
      - ./db:/docker-entrypoint-initdb.d
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sms_user -d sms_db -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend_api:
    build: ./backend_api
    container_name: sms_backend_api
    restart: unless-stopped
    environment:
      - DB_HOST=db
      - DB_USER=sms_user
      - DB_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - DB_NAME=sms_db
      - DB_PORT=5432
      - SECRET_KEY=${SECRET_KEY:-change_this_secret_in_production}
      - ADMIN_IDENTIFIER=${ADMIN_IDENTIFIER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-changeme}
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: ./worker
    container_name: sms_worker
    restart: unless-stopped
    environment:
      - DB_HOST=db
      - DB_USER=sms_user
      - DB_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - DB_NAME=sms_db
      - DB_PORT=5432
      - SMS_GATEWAY_IP=${SMS_GATEWAY_IP}
      - SMS_GATEWAY_LOGIN=${SMS_GATEWAY_LOGIN}
      - SMS_GATEWAY_PASSWORD=${SMS_GATEWAY_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  web_interface:
    build:
      context: ./web_interface
      dockerfile: Dockerfile
    container_name: sms_web_interface
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend_api

volumes:
  db_data:

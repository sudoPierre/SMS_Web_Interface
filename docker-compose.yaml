
services:
  db:
    image: postgres:16-alpine
    pull_policy: always
    container_name: sms_database
    restart: unless-stopped
    environment:
      POSTGRES_USER: sms_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: sms_db
    ports:
      - "5432:5432"
    volumes:
      - ./db:/docker-entrypoint-initdb.d
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sms_user -d sms_db -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  backend_api:
    build: ./backend_api
    pull_policy: build
    container_name: sms_backend_api
    environment:
      - DB_HOST=db
      - DB_USER=sms_user
      - DB_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - DB_NAME=sms_db
      - DB_PORT=5432
      - SECRET_KEY=${SECRET_KEY:-change_this_secret_in_production}
      - ADMIN_IDENTIFIER=${ADMIN_IDENTIFIER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-changeme}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: ./worker
    pull_policy: build
    container_name: sms_worker
    environment:
      - DB_HOST=db
      - DB_USER=sms_user
      - DB_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - DB_NAME=sms_db
      - DB_PORT=5432
      - SMS_GATEWAY_IP=${SMS_GATEWAY_IP:-192.168.1.63}
      - SMS_GATEWAY_LOGIN=${SMS_GATEWAY_LOGIN:-sms}
      - SMS_GATEWAY_PASSWORD=${SMS_GATEWAY_PASSWORD:-nVVJ-k9a}
    depends_on:
      db:
        condition: service_healthy

  web_interface:
    build:
      context: ./web_interface
      args:
        VITE_BACKEND_API_URL: ${VITE_BACKEND_API_URL:-https://sms.pierre-qui-roule.fr:8000}
    pull_policy: build
    container_name: sms_web_interface
    ports:
      - "5173:5173"

volumes:
  db_data:
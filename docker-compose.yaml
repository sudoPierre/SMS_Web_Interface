services:
  db:
    build: ./db
    pull_policy: build
    restart: unless-stopped
    environment:
      POSTGRES_USER: sms_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: sms_db
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sms_user -d sms_db -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend_api:
    build: ./backend_api
    pull_policy: build
    restart: unless-stopped
    environment:
      - DB_HOST=db
      - DB_USER=sms_user
      - DB_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - DB_NAME=sms_db
      - DB_PORT=5432
      - SECRET_KEY=${SECRET_KEY:-change_this_secret_in_production}
      - ADMIN_IDENTIFIER=${ADMIN_IDENTIFIER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-changeme}
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: ./worker
    pull_policy: build
    restart: unless-stopped
    environment:
      - DB_HOST=db
      - DB_USER=sms_user
      - DB_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - DB_NAME=sms_db
      - DB_PORT=5432
      # Full gateway API URL. Local mode: http://<phone-ip>:8080 — Cloud mode: https://api.sms-gate.app/3rdparty/v1
      - SMS_GATEWAY_URL=${SMS_GATEWAY_URL:-}
      - SMS_GATEWAY_IP=${SMS_GATEWAY_IP:-}
      - SMS_GATEWAY_LOGIN=${SMS_GATEWAY_LOGIN}
      - SMS_GATEWAY_PASSWORD=${SMS_GATEWAY_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  # Serves the SPA and proxies /api and /webhook to backend_api — point the Coolify domain here (port 5173)
  web_interface:
    build: ./web_interface
    pull_policy: build
    restart: unless-stopped
    expose:
      - "5173"
    depends_on:
      - backend_api

volumes:
  db_data:
